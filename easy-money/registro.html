<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registrar Gasto</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<div class="layout">

    <div class="sidebar">
        <h2>💰 Finanzas</h2>
        <a href="index.html">🏠 Inicio</a>
        <a href="registro.html">➕ Registrar Gasto</a>
        <a href="resumen.html">📊 Resumen</a>
    </div>

    <div class="main">
        <div class="header">Registrar Nuevo Gasto</div>

        <div class="card">

            <div class="form-group">
                <label>Descripción</label>
                <input type="text">
            </div>

            <div class="form-group">
                <label>Monto</label>
                <input type="number">
            </div>

            <div class="form-group">
                <label>Categoría</label>
                <select>
                    <option>Comida</option>
                    <option>Transporte</option>
                    <option>Entretenimiento</option>
                    <option>Servicios</option>
                    <option>Salud</option>
                    <option>Educación</option>
                    <option>Otros</option>
                </select>
            </div>

            <div class="form-group">
                <label>Fecha</label>
                <input type="date" id="fecha">
            </div>

            <button>Guardar Gasto</button>

        </div>
    </div>

</div>

<script>
const hoy = new Date();
const año = hoy.getFullYear();
const mes = String(hoy.getMonth() + 1).padStart(2, '0');
const dia = String(hoy.getDate()).padStart(2, '0');
document.getElementById("fecha").value = `${año}-${mes}-${dia}`;
</script>

</body>
</html>
